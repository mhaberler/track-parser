<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Track parser</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body { height: 100%; margin: 0; }
    #map { height: 100%; }
    form {
      position: absolute;
      z-index: 500;
      top: 12px;
      left: 12px;
      background: #fff;
      padding: 8px 10px;
      border-radius: 6px;
      font: 14px/1.4 system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <form>
    <label>
      GPS file
      <input id="file" name="track" type="file" accept=".gpx,.kml,.kmz,.geojson,.json,.igc" />
    </label>
    <p id="status" aria-live="polite"></p>
  </form>
  <div id="map"></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
